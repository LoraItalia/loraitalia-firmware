name: PlatformIO CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'specify firmware version tag'
        required: true
        type: string
      ftpTarget:
        description: 'specify firmware target on FTP Server'
        default: '/'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Validate tag
        run: |
          validate_tag() {
            local tag="$1"
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9][0-9]+\.([a-z0-9]{7})$ ]]; then
              return 0
            else
              return 1
            fi
          }    
          if ! validate_tag "${{ inputs.tag }}"; then
            echo "Errore: il tag '$tag' non è valido. Deve rispettare il formato v2.5.19.d5cd6f8."
            exit 1
          else
            echo "Il tag '${{ inputs.tag }}' è valido."
          fi